<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEzy — Live Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1f2a44 0%, #2d3f6b 100%);
            min-height: 100vh;
            padding: 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 28px;
        }

        nav .brand { color: #fff; font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }

        nav a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 6px;
            transition: all 0.2s;
        }
        nav a:hover { background: rgba(255,255,255,0.12); color: #fff; }
        nav a.active { background: rgba(255,255,255,0.18); color: #fff; }

        .container { max-width: 1100px; margin: 0 auto; }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            margin-bottom: 22px;
        }

        .upload-area { text-align: center; }
        .upload-area h2 { color: #1f2a44; margin-bottom: 22px; font-size: 1.3rem; }

        .file-input-wrapper input[type="file"] { display: none; }

        .file-label {
            display: inline-block;
            padding: 11px 28px;
            background: #2d3f6b;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .file-label:hover { background: #1f2a44; transform: translateY(-1px); }

        .file-name { display: block; margin-top: 10px; color: #888; font-size: 0.85rem; }

        .detect-btn {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 38px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .detect-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .detect-btn:disabled { background: #ccc; cursor: not-allowed; }

        .error {
            background: #fff0f0; color: #c33;
            padding: 12px 16px; border-radius: 8px;
            margin-bottom: 16px; display: none;
            font-size: 0.9rem;
        }
        .error.active { display: block; }

        .loading { display: none; text-align: center; padding: 20px; }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 46px; height: 46px;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-section { display: none; }
        .result-section.active { display: block; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 22px 16px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-card.red   { background: linear-gradient(135deg, #ee0979, #ff6a00); }

        .stat-card .num { font-size: 2.2rem; font-weight: 700; }
        .stat-card .lbl { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

        .result-image {
            width: 100%; border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .legend {
            display: flex; justify-content: center; gap: 28px;
            margin-top: 18px; padding: 12px;
            background: #f8f9fa; border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .dot { width: 16px; height: 16px; border-radius: 3px; }
        .dot.green { background: #38ef7d; }
        .dot.red   { background: #ff6a00; }

        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <span class="brand">🅿 ParkEzy</span>
    <div>
        <a href="/" class="active">Live Detection</a>
        <a href="/dashboard" style="margin-left:10px">Analytics</a>
        <a href="/evaluation" style="margin-left:10px">Evaluation</a>
    </div>
</nav>

<div class="container">

    <div class="card">
        <div class="upload-area">
            <h2>Upload Parking Lot Image</h2>

            <div class="error" id="error"></div>

            <form id="uploadForm">
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" name="image"
                           accept="image/png,image/jpeg,image/jpg">
                    <label for="imageInput" class="file-label">📁 Choose Image</label>
                    <span class="file-name" id="fileName">No file chosen</span>
                </div>
                <br>
                <button type="submit" class="detect-btn" id="detectBtn">
                    🔍 Detect Parking Spaces
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="color:#555">Analyzing parking spaces…</p>
            </div>
        </div>
    </div>

    <div class="result-section" id="resultSection">
        <div class="card">
            <h2 style="color:#1f2a44;margin-bottom:20px;text-align:center">Detection Results</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="num" id="totalSlots">—</div>
                    <div class="lbl">Total Slots</div>
                </div>
                <div class="stat-card green">
                    <div class="num" id="vacantSlots">—</div>
                    <div class="lbl">Vacant</div>
                </div>
                <div class="stat-card red">
                    <div class="num" id="occupiedSlots">—</div>
                    <div class="lbl">Occupied</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="occupancyRate">—</div>
                    <div class="lbl">Occupancy Rate</div>
                </div>
            </div>

            <img id="resultImage" class="result-image" alt="Detection Result">

            <div class="legend">
                <div class="legend-item"><div class="dot green"></div> Vacant Slot</div>
                <div class="legend-item"><div class="dot red"></div> Occupied Slot</div>
            </div>
        </div>
    </div>

</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const fileName   = document.getElementById('fileName');
    const uploadForm = document.getElementById('uploadForm');
    const loading    = document.getElementById('loading');
    const resultSec  = document.getElementById('resultSection');
    const errorDiv   = document.getElementById('error');
    const detectBtn  = document.getElementById('detectBtn');

    imageInput.addEventListener('change', e => {
        fileName.textContent = e.target.files[0]?.name || 'No file chosen';
    });

    uploadForm.addEventListener('submit', async e => {
        e.preventDefault();
        const file = imageInput.files[0];
        if (!file) { showError('Please select an image file'); return; }

        const fd = new FormData();
        fd.append('image', file);

        loading.classList.add('active');
        errorDiv.classList.remove('active');
        resultSec.classList.remove('active');
        detectBtn.disabled = true;

        try {
            const res  = await fetch('/detect', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) showResults(data);
            else showError(data.error || 'Detection failed');
        } catch (err) {
            showError('Network error: ' + err.message);
        } finally {
            loading.classList.remove('active');
            detectBtn.disabled = false;
        }
    });

    function showResults(data) {
        document.getElementById('totalSlots').textContent    = data.total_slots;
        document.getElementById('vacantSlots').textContent   = data.vacant;
        document.getElementById('occupiedSlots').textContent = data.occupied;
        document.getElementById('occupancyRate').textContent = data.occupancy_rate + '%';
        document.getElementById('resultImage').src = data.image_path + '?t=' + Date.now();
        resultSec.classList.add('active');
        resultSec.scrollIntoView({ behavior: 'smooth' });
    }

    function showError(msg) {
        errorDiv.textContent = '❌ ' + msg;
        errorDiv.classList.add('active');
    }
</script>

</body>
</html>
