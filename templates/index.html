<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ParkEzy</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1f2a44,#2d3f6b);
    margin:0;
}

nav {
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    color:white;
}

.container {
    max-width:900px;
    margin:40px auto;
}

.card {
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align:center;
    margin-bottom:20px;
}

/* FILE INPUT */
.file-label {
    display:inline-block;
    background:#2d3f6b;
    color:white;
    padding:10px 25px;
    border-radius:8px;
    cursor:pointer;
}

#fileName {
    margin-top:10px;
    color:#777;
}

/* BUTTON */
.detect-btn {
    margin-top:20px;
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

/* STATS */
.stats {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.stat {
    padding:15px;
    border-radius:8px;
    text-align:center;
    color:white;
}

.green { background:#38ef7d; }
.red { background:#ff6a00; }
.blue { background:#667eea; }

/* FRAMES */
#frameContainer {
    display:flex;
    flex-wrap:wrap;
    margin-top:20px;
}

.frame-card {
    margin:10px;
    text-align:center;
}

.frame-card img {
    width:200px;
    border-radius:8px;
    transition:0.2s;
}

.frame-card img:hover {
    transform:scale(1.05);
}
</style>
</head>

<body>

<nav>
    <h2>🅿 ParkEzy</h2>
    <div>
        <a href="/" style="color:white;">Live Detection</a>
        <a href="/dashboard" style="color:white; margin-left:15px;">Analytics</a>
    </div>
</nav>

<div class="container">

<div class="card">
    <h2>Upload Parking Image / Video</h2>

    <form id="form">
        <input type="file" id="fileInput" hidden>
        <label for="fileInput" class="file-label">Choose File</label>
        <p id="fileName">No file selected</p>

        <label>
            <input type="checkbox" id="newLot"> New Parking Lot
        </label>

        <button class="detect-btn">Detect Parking</button>
    </form>
</div>

<div class="card" id="resultSection" style="display:none;">
    <h2>Results</h2>

    <div class="stats">
        <div class="stat blue"><h3 id="total">-</h3>Total</div>
        <div class="stat green"><h3 id="vacant">-</h3>Vacant</div>
        <div class="stat red"><h3 id="occupied">-</h3>Occupied</div>
        <div class="stat blue"><h3 id="rate">-</h3>Rate</div>
    </div>

    <div id="frameContainer"></div>
</div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const newLot = document.getElementById("newLot");
const resultSection = document.getElementById("resultSection");
const frameContainer = document.getElementById("frameContainer");

fileInput.onchange = () => {
    fileName.innerText = fileInput.files[0]?.name || "No file";
};

document.getElementById("form").onsubmit = async (e)=>{
    e.preventDefault();

    console.log("Detect clicked");

    const file = fileInput.files[0];
    if(!file){
        alert("Select file");
        return;
    }

    const fd = new FormData();
    fd.append("file", file);

    if(newLot.checked) fd.append("new_lot","1");

    try {
        const res = await fetch("/upload", {
            method:"POST",
            body:fd
        });

        const data = await res.json();
        console.log(data);

        show(data);

    } catch(err){
        console.error(err);
        alert("Error occurred");
    }
};

function show(data){

    resultSection.style.display="block";

    document.getElementById("total").innerText = data.total_slots;
    document.getElementById("vacant").innerText = data.vacant;
    document.getElementById("occupied").innerText = data.occupied;
    document.getElementById("rate").innerText = data.occupancy_rate;

    frameContainer.innerHTML="";

    if(data.frames){
        data.frames.forEach(f=>{
            const div = document.createElement("div");
            div.className="frame-card";

            div.innerHTML = `
                <img src="${f.image}?t=${Date.now()}">
                <p>Frame ${f.frame}<br>Available: ${f.available}</p>
            `;

            frameContainer.appendChild(div);
        });
    }
}

</script>

</body>
</html>
